# Technical Analysis Playbooks — 기술적 분석 스코어링 기준
# 공개 정보 기반 리서치 보조. 투자 판단 책임은 사용자에게 있음.
# 상관관계는 인과관계가 아님.

# ── RSI (Relative Strength Index) ────────────────────────────────────────────
rsi:
  oversold:        30    # 이하: 과매도 (LONG 반등 가능성)
  overbought:      70    # 이상: 과열 (SHORT 경계, LONG 추격주의)
  swing_long_zone: [45, 65]   # 스윙 LONG 선호 구간 (눌림 후 재상승)
  short_setup:     70    # 이상 후 꺾임/이탈: SHORT 관찰 시작
  score_rules:
    long:
      - range: [45, 65]
        score: 8
        label: RSI 스윙 LONG 적정 구간
      - range: [35, 45]
        score: 5
        label: RSI 반등 가능 구간
      - range: [0, 30]
        score: 3
        label: RSI 과매도 (급반등 가능)
      - threshold_above: 70
        score: -5
        label: RSI 과열 — LONG 추격주의
    short:
      - threshold_above: 70
        score: 8
        label: RSI 과열 구간 (SHORT 관찰)
      - range: [60, 70]
        score: 4
        label: RSI 고온 구간
      - threshold_below: 45
        score: -5
        label: RSI SHORT 기준 미충족

# ── Bollinger Band ────────────────────────────────────────────────────────────
bollinger_band:
  squeeze_threshold: 0.05   # 밴드 폭 / 중심선 < 5%: 수축 상태
  entry_patterns:
    long:
      - pattern: 하단 이탈 후 회복
        score: 8
        condition: 종가가 하단 밴드 이하였다가 중단 방향 회복
      - pattern: 중단 회복
        score: 7
        condition: 종가가 중단(MA20) 위로 복귀
      - pattern: 수축 후 상단 접근
        score: 7
        condition: squeeze 후 상단 방향 돌파 시도
      - pattern: 상단 돌파 + 거래량 확인
        score: 6
        condition: 상단 돌파 + 거래량 평균 대비 1.5배 이상
    short:
      - pattern: 상단 이탈 후 하락 전환
        score: 8
        condition: 종가가 상단 밴드 초과 후 중단 이탈
      - pattern: 중단 이탈
        score: 7
        condition: 중단(MA20) 아래로 이탈
      - pattern: 밴드 수축 중 하방 돌파
        score: 6
        condition: squeeze 후 하단 방향 이탈
  caution:
    - 밴드 수축(squeeze) 없이 상단 급등은 과열 확인 필요
    - 상단 돌파 + 윗꼬리 장대 = 추격주의

# ── Moving Average ────────────────────────────────────────────────────────────
moving_average:
  periods:
    - ma: 20
      label: 단기 추세 (스윙 기준선)
    - ma: 60
      label: 중기 추세 (중기 방향)
    - ma: 120
      label: 장기 추세 (구조적 방향)
  score_rules:
    long:
      - condition: 종가 > MA20 (지지)
        score: 4
        label: MA20 지지 확인
      - condition: 종가 MA20 회복 (이탈 후 재진입)
        score: 6
        label: MA20 회복
      - condition: 종가 > MA60 유지
        score: 3
        label: MA60 위 유지
      - condition: MA20 > MA60 (정배열)
        score: 4
        label: 정배열 확인
    short:
      - condition: 종가 < MA20 이탈
        score: 4
        label: MA20 이탈
      - condition: 종가 < MA60 이탈
        score: 5
        label: MA60 이탈
      - condition: MA20 < MA60 (역배열)
        score: 4
        label: 역배열 확인
  overheat_signal:
    - MA20 / MA60 괴리 > 25%: 단기 과열 경고
    - 종가 > MA20 * 1.3: 급등 추격주의

# ── OBV (On Balance Volume) ───────────────────────────────────────────────────
obv:
  signal_rules:
    - signal: 가격 횡보 + OBV 상승
      interpretation: 매집 가능성 있는 수급 패턴
      score: 8
      side: LONG
    - signal: 가격 상승 + OBV 하락 (divergence)
      interpretation: OBV divergence warning — 수급 이탈 주의
      score: -4
      side: LONG
    - signal: 가격 하락 + OBV 상승
      interpretation: 하락 중 수급 유입 — 반전 가능성 관찰
      score: 4
      side: LONG
    - signal: OBV 추세 하락
      interpretation: SHORT 관찰 수급 근거
      score: 8
      side: SHORT
    - signal: OBV 추세 상승
      interpretation: SHORT 역방향 수급 — 주의
      score: -4
      side: SHORT
  label:
    상승: OBV 상승 (수급 유입)
    하락: OBV 하락 (수급 이탈)
    횡보: OBV 횡보 (중립)

# ── Volume Analysis ───────────────────────────────────────────────────────────
volume:
  reference_period: 20   # 20일 평균 기준
  signal_rules:
    - condition: 거래량 > 평균 * 1.5
      label: 거래량 급증 (확인 필요)
      score: 3
    - condition: 거래량 > 평균 * 3.0
      label: 거래량 폭발
      score: 5
    - condition: 거래량 < 평균 * 0.5
      label: 거래량 감소 (추세 약화 가능)
      score: -2
  caution_patterns:
    - 장대양봉 + 거래량 폭발 + 윗꼬리 = 추격주의 (고점 매집 가능성)
    - 장대음봉 + 거래량 폭발 = 매도 압력 강화

# ── Composite Technical Score ─────────────────────────────────────────────────
composite_score:
  formula: |
    technical_score =
      rsi_setup (0~8)
      + bb_setup (0~8)
      + obv_setup (0~8)
      + ma_setup (0~6)
      + volume_setup (0~5)
      - overheat_penalty (0~10)
  max: 30
  thresholds:
    long_strong: "20이상"   # LONG 강한 셋업
    long_moderate: "12이상"  # LONG 관찰 후보
    neutral: "12미만"        # 기준 미달
    short_strong: "20이상"   # SHORT 강한 셋업

# ── Swing Grade Criteria ──────────────────────────────────────────────────────
swing_grade:
  A_grade:
    min_score: 80
    conditions:
      - RSI 45~65 (LONG) 또는 70+ 후 꺾임 (SHORT)
      - BB 중단 회복 또는 수축 후 상단 접근
      - OBV 상승 추세 확인
      - MA20 지지 또는 회복
      - 거래량 평균 이상 확인
    expected_reward_range: "+5~15% (1D~1M 관찰 기준, 확정 아님)"
  B_grade:
    min_score: 65
    conditions:
      - 2~3개 조건 충족
    expected_reward_range: "+3~10% (관찰 기준, 확정 아님)"
  C_grade:
    min_score: 50
    conditions:
      - 1~2개 조건 충족, 혼재
  below_criteria:
    max_score: 49
    label: 기준 미달

# ── Invalidation (무효화/리스크 기준) ────────────────────────────────────────
invalidation:
  long_observe:
    - RSI 4H < 30 & OBV 하락 & BB 하단 이탈 → 관찰 중단 기준
    - 종가 MA60 이하 이탈 + 거래량 증가 → 중기 무효화
    - 목표 보상 구간 미도달 + 반전 → 리스크 기준 도달
  short_observe:
    - RSI 4H < 50 반등 & OBV 반전 → SHORT 관찰 중단
    - 종가 MA20 위 회복 + 거래량 증가 → 무효화
  note: |
    무효화/리스크 기준 도달 = 관찰 종료 권장.
    확정 손익이 아닌 관찰 기준 이탈.
    실제 매매 판단은 사용자에게 있음.
