# Valuation Playbooks — 섹터별 기업가치 평가 기준
# 공개 정보 기반 리서치 보조. 투자 판단 책임은 사용자에게 있음.
# "매수 권장" / "확정 수익" 표현 금지.

# ── A. AI 반도체 / HBM / 메모리 / 파운드리 ─────────────────────────────────
ai_semiconductor_hbm_foundry:
  primary_metrics:
    - HBM 공급단가(ASP)와 고객사 수요
    - DRAM/NAND 계약가 방향
    - AI CAPEX 집행 속도 (NVDA/AMD/하이퍼스케일러)
    - 파운드리 가동률 / 첨단공정 전환율
  secondary_metrics:
    - 재고 사이클 위치 (재고/매출 비율)
    - 공장 증설 타임라인
    - 고객사 집중도 리스크
  pe_note: "PER보다 사이클 이익 방향, ASP, 고객사 수요 더 중요"
  normal_pe_range: [15, 80]
  key_watchpoints:
    - SOXX / SMH ETF 방향 확인
    - HBM 공급 타이트 여부 (NVDA 서버 출하)
    - 10Y 금리 방향 (성장주 할인율)

# ── B. 반도체 장비 / 소재 / 부품 / OSAT ────────────────────────────────────
semiconductor_equipment_materials:
  primary_metrics:
    - 고객사 CAPEX 계획과 집행 시기
    - 수주잔고 / book-to-bill ratio
    - 장비 리드타임
  secondary_metrics:
    - 소재: wafer 투입량, 가동률
    - 부품: 소모성 매출 반복성
    - OSAT: advanced packaging 비중
  pe_note: "수주 사이클과 장비 리드타임이 핵심"
  normal_pe_range: [12, 50]

# ── C. 소프트웨어 / SaaS / AI / 클라우드 / 보안 ────────────────────────────
saas_software_cloud:
  primary_metrics:
    - ARR / RPO (남은 이행의무)
    - NRR (Net Revenue Retention 120%+ = 강한 유보)
    - Rule of 40 (성장률 + FCF 마진 ≥ 40)
    - FCF margin
  secondary_metrics:
    - 영업 레버리지 방향
    - GPU/AI 인프라 비용 부담
    - 좌석형 vs 사용량 기반 구분
  pe_note: "고PER은 성장 지속성으로 정당화. FCF 전환 타임라인이 핵심"
  normal_pe_range: [-50, 500]
  high_pe_justification:
    - NRR > 120%
    - Rule of 40 > 50
    - 연간 성장률 > 20%

# ── D. 바이오 / 제약 / 임상 ─────────────────────────────────────────────────
bio_pharma_clinical:
  primary_metrics:
    - 임상 단계 (Phase 1/2/3)
    - TAM / 적응증 시장규모
    - 현금 runway (소진 시점)
    - FDA/MFDS/EMA 승인 일정 (PDUFA date)
  secondary_metrics:
    - 기술이전 / 파트너십 계약
    - 유상증자 / CB / BW 리스크
    - 바이오시밀러 vs 신약 구분
  pe_note: "PER 무의미 (대부분 적자). 임상 단계, 시장규모, 현금소진이 핵심"
  normal_pe_range: [-9999, 9999]
  risk_flags:
    - Phase 3 실패 시 급락 리스크
    - primary completion → topline 발표 간격
    - 희귀질환 vs 일반 적응증 시장 차이

# ── E. CDMO / 바이오 생산 / ADC ─────────────────────────────────────────────
cdmo_bio_manufacturing:
  primary_metrics:
    - 수주잔고 / 가동률
    - 고객사 파이프라인 단계별 분포
    - CMO/CDO 계약 규모
    - 공장 증설 타임라인
  secondary_metrics:
    - 마진 (API vs DP 구분)
    - 고객사 집중도
    - ADC 역량 / 플랫폼 기술
  pe_note: "수주잔고와 가동률 개선 방향이 핵심. PER은 정상화 이후 판단"
  normal_pe_range: [10, 60]

# ── F. 조선 / 해운 / LNG / 기자재 ──────────────────────────────────────────
shipbuilding_lng:
  primary_metrics:
    - 수주잔고 (금액, 년수)
    - 신규 수주 속도
    - 선가 (조선 클락슨 신조선가)
    - 납기 / 인도 스케줄
  secondary_metrics:
    - 후판/철강 원가
    - 환율 영향 (달러 매출 / 원화 비용)
    - 기자재 후행성 (엔진/보냉재)
  pe_note: "PER보다 backlog와 margin improvement 방향이 중요"
  normal_pe_range: [5, 30]

# ── G. 방산 / 우주 / 항공 ───────────────────────────────────────────────────
defense_aerospace:
  primary_metrics:
    - 수주잔고 (국내 + 수출)
    - 수출계약 파이프라인
    - 국방예산 증가율
    - 지정학적 수요 촉매
  secondary_metrics:
    - 수출허가 절차
    - 납품 지연 리스크
    - 원가 / 환율
  pe_note: "장기 백로그와 수출 다각화가 핵심 가치"
  normal_pe_range: [12, 40]

# ── H. 자동차 / EV / 로봇택시 ───────────────────────────────────────────────
auto_ev_robotaxi:
  primary_metrics:
    - 출하량 / 판매 mix
    - ASP (평균판매가)
    - 배터리 원가 하락 속도
    - 자율주행/로봇택시 이벤트
  secondary_metrics:
    - 재고 수준
    - 정부 보조금/정책
    - 완성차→부품사 후행성
  pe_note: "EV 전환 속도와 마진 개선이 핵심. 자율주행은 옵션가치"
  normal_pe_range: [5, 40]

# ── I. 배터리 / 소재 / 리튬 ─────────────────────────────────────────────────
battery_materials_lithium:
  primary_metrics:
    - 리튬/니켈/코발트 가격
    - 고객사 OEM 발주
    - IRA / 정책 수혜
    - 양극재/음극재 마진
  secondary_metrics:
    - 재고 사이클
    - CAPEX 부담 vs 가동률
  pe_note: "원자재 사이클과 정책 수혜가 핵심"
  normal_pe_range: [8, 50]

# ── J. 금융 / 은행 / 보험 / 증권 ────────────────────────────────────────────
financial_banking:
  primary_metrics:
    - NIM (순이자마진)
    - NPL (부실여신비율)
    - CET1 (자본비율)
    - PBR (시장가/장부가)
    - 주주환원 (배당 + 자사주)
  secondary_metrics:
    - 보험: K-ICS, 장기금리, 손해율
    - 증권: 거래대금, 신용융자, IB 수수료
    - 카드/핀테크: 결제량, take rate, 연체율
  pe_note: "PBR 1배 이하 저평가 스크리닝. NIM/NPL 방향이 핵심"
  normal_pe_range: [5, 20]
  normal_pbr_range: [0.3, 2.0]

# ── K. 에너지 / 정유 / LNG / 재생 ──────────────────────────────────────────
energy_oil_lng_renewable:
  primary_metrics:
    - WTI/Brent 방향
    - 정제마진
    - LNG 가격
    - 재생에너지 PPA 계약
  secondary_metrics:
    - 유틸리티: cap rate, 부채만기
    - 원가 pass-through 능력
  pe_note: "원자재 사이클 연동이 강함. 정제마진 방향이 단기 핵심"
  normal_pe_range: [5, 20]

# ── L. 소재 / 화학 / 철강 / 비철 ────────────────────────────────────────────
materials_chemicals_steel:
  primary_metrics:
    - 주요 원자재 가격 (철광석, 나프타, 전기동 등)
    - 스프레드 (제품-원료 마진)
    - 중국 수요
    - 재고 사이클
  secondary_metrics:
    - 원가 pass-through 능력
    - 전선/조선/건설 원가 영향
  pe_note: "스프레드와 중국 수요 연동. 사이클 중반~후반 PER 낮아짐"
  normal_pe_range: [5, 20]

# ── M. 건설 / 인프라 / 리츠 ─────────────────────────────────────────────────
construction_reit:
  primary_metrics:
    - 수주잔고 (국내 + 해외)
    - PF/미분양 리스크
    - 금리 (대출 비용 / cap rate)
    - 리츠: cap rate, 임대수익
  secondary_metrics:
    - 원자재 가격
    - 해외 플랜트 수주
    - 부채 만기 스케줄
  pe_note: "수주잔고와 PF 리스크가 핵심. 리츠는 배당수익률 기준"
  normal_pe_range: [5, 20]

# ── N. K뷰티 / 소비재 ───────────────────────────────────────────────────────
kbeauty_consumer:
  primary_metrics:
    - 미국/중국/일본 채널 매출 비중
    - ODM vs 브랜드 구분
    - 재고 수준
    - 마진 (채널 믹스 영향)
  secondary_metrics:
    - Amazon/Ulta/Sephora/TikTok Shop 채널
    - 환율 영향
    - 신제품 출시 pipeline
  pe_note: "채널 다각화와 미국 시장 침투율이 핵심 성장 드라이버"
  normal_pe_range: [10, 40]

# ── O. 유통 / 여행 / 항공 / 카지노 ─────────────────────────────────────────
retail_travel_casino:
  primary_metrics:
    - 소비지표 (소매판매, 소비자심리)
    - 항공 여객 (load factor, yield)
    - 객단가 / RevPAR
    - 유가 영향 (항공)
  secondary_metrics:
    - 중국 관광 회복
    - 레버리지 (부채/EBITDA)
    - 환율
  pe_note: "경기 민감주. 소비 사이클 초반에 선행"
  normal_pe_range: [8, 40]

# ── P. 미디어 / 콘텐츠 / 게임 / 엔터 ───────────────────────────────────────
media_content_entertainment:
  primary_metrics:
    - IP pipeline (신작/흥행 일정)
    - MAU/ARPU
    - 광고 경기
    - 콘서트/투어 일정 (엔터)
  secondary_metrics:
    - 제작비 vs 매출 구조
    - 글로벌 확장 여부
  pe_note: "IP와 흥행에 크게 좌우. 선행지표가 약해 모멘텀 의존"
  normal_pe_range: [10, 60]

# ── Q. 통신 / 네트워크 / 광통신 ─────────────────────────────────────────────
telecom_network_optical:
  primary_metrics:
    - AI networking (optical, Ethernet, InfiniBand)
    - Apple/iPhone 사이클
    - 5G/6G CAPEX
    - 광모듈/케이블 수요
  secondary_metrics:
    - 통신사 CAPEX
    - 통신장비 수주
  pe_note: "AI 데이터센터 광통신 수요가 신성장. 통신사는 배당 중심"
  normal_pe_range: [8, 40]

# ── R. 음식료 / 농업 / 비료 ─────────────────────────────────────────────────
food_agriculture:
  primary_metrics:
    - 원재료 가격 (곡물, 유지)
    - 가격 인상 능력
    - 수출 데이터
    - 마진 방향
  secondary_metrics:
    - 환율
    - 비료/농약: 작황 사이클
  pe_note: "방어주 특성. 원재료 사이클 + 가격 인상 조합이 핵심"
  normal_pe_range: [8, 25]

# ── S. 산업재 / 기계 / 자동화 / 로봇 ───────────────────────────────────────
industrials_robots:
  primary_metrics:
    - 제조업 CAPEX
    - 수주잔고
    - 로봇/감속기/센서 수요
    - 건설장비 경기
  secondary_metrics:
    - 경기 민감도 (PMI 연동)
    - AI/자동화 전환 속도
  pe_note: "PMI와 CAPEX 사이클 연동이 강함"
  normal_pe_range: [10, 35]
