# 섹터별 분석 플레이북 — 24개 섹터
# 공개 정보 기반 리서치 보조. 투자 판단 책임은 사용자에게 있음.
# "매수 권장" / "확정 수익" 표현 금지.

ai_semiconductor_hbm_foundry:
  display_name: "AI 반도체 / HBM / 파운드리"
  key_questions:
    - "HBM / DRAM / NAND / 파운드리 / OSAT 중 어느 노출인가?"
    - "고객사 NVDA/AMD/TSM/SK하이닉스 CAPEX 사이클은?"
    - "HBM 공급부족/재고 사이클 위치는?"
  key_metrics:
    - "HBM 공급단가(ASP)"
    - "파운드리 가동률"
    - "DRAM/NAND 계약가 추세"
    - "CAPEX 집행 속도"
  catalysts:
    - "HBM4/HBM4E 수요 확대"
    - "NVDA/AMD 차세대 GPU 출시"
    - "AI 추론용 반도체 주문 증가"
    - "파운드리 선단공정 전환"
  risks:
    - "CAPEX 지연 또는 고객 주문 연기"
    - "중국 수출 규제 강화"
    - "과잉공급 전환 시 ASP 하락"
    - "고객사 집중 리스크"
  swing_checkpoints:
    - "SOXX 방향 + NVDA 실적 가이던스"
    - "10Y 금리 방향 (성장주 할인율)"
    - "HBM 공급 타이트 여부"
    - "4H RSI 50~60 눌림 구간 확인"
  exit_checkpoints:
    - "SOXX 2주 +15% 이상이면 차익실현 점수 강화"
    - "NVDA 실적 발표 직전 가이던스 리스크"
  valuation_note: "성장주 DCF — 금리 민감도 높음, PER(F) 30~40배 구간 관찰"

