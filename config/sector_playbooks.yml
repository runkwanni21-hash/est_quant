    - "소재 납품 단가"
    - "고객사 CAPEX 예산"
    - "OSAT 가동률"
  catalysts:
    - "TSMC/삼성 HBM 라인 증설 발주"
    - "첨단 패키징(CoWoS/HBM) 물량 확대"
  risks:
    - "CAPEX 사이클 하강"
    - "중국 소재 의존 리스크"
    - "고객사 납기 연기"
  swing_checkpoints:
    - "SOXX 방향 + 고객사 CAPEX 발표"
    - "4H RSI 45~55 눌림 후 반등 확인"
  exit_checkpoints:
    - "CAPEX 수혜 기대가 이미 선반영됐는지 확인"
  valuation_note: "PER(F) 20~30배, EPS성장 + backlog 성장률 복합 평가"

